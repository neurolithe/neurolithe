name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one target's failure cancel the others — ship whatever builds.
      fail-fast: false
      # Published binaries are the STANDALONE build (default features): embedded
      # stores + MCP server, no Kafka/rdkafka — so they build on every target
      # (only bundled SQLite's C, which is portable). The Kafka daemon ships via
      # the Docker image (`--features kafka`).
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: neurolithe
          # Build x86_64 on the Intel runner (macos-13); macos-latest is arm64.
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: neurolithe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: neurolithe
          # Windows is back now that rdkafka is feature-gated — the standalone
          # build has no librdkafka, and bundled SQLite builds fine on MSVC.
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: neurolithe.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Default features = standalone (no Kafka). Do NOT add --features kafka
      # here, or Windows/other targets regain the librdkafka toolchain problem.
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../neurolithe-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../neurolithe-${{ matrix.target }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neurolithe-${{ matrix.target }}.tar.gz
            neurolithe-${{ matrix.target }}.zip
