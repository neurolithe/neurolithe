name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Don't let one target's failure cancel the others — ship whatever builds.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: neurolithe
          # `macos-latest` is Apple Silicon (arm64); rdkafka-sys builds its
          # vendored C lib for the runner arch, so an x86_64 cross-build there
          # link-fails. Build x86_64 on the Intel runner (macos-13) instead.
          - target: x86_64-apple-darwin
            os: macos-13
            artifact: neurolithe
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: neurolithe
          # NOTE: no prebuilt Windows target — rdkafka-sys (added in V2) builds
          # its vendored librdkafka via a Unix `configure` that fails on Windows
          # MSVC. Windows users build from source (WSL) or run the Docker image.
          # Restore this target once rdkafka is feature-gated or `cmake-build`ing.

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package artifact (Unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../neurolithe-${{ matrix.target }}.tar.gz ${{ matrix.artifact }}

      - name: Package artifact (Windows)
        if: runner.os == 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path ${{ matrix.artifact }} -DestinationPath ../../../neurolithe-${{ matrix.target }}.zip

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            neurolithe-${{ matrix.target }}.tar.gz
            neurolithe-${{ matrix.target }}.zip
