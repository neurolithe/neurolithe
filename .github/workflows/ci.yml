name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      # Standalone (default) build — the published binaries; no Kafka/rdkafka.
      - name: Clippy (standalone)
        run: cargo clippy --all-targets -- -D warnings

      - name: Test (standalone)
        run: cargo test --verbose

      # Full daemon build — the JARVIS Docker image; enables the `kafka` feature.
      - name: Clippy (kafka)
        run: cargo clippy --all-targets --features kafka -- -D warnings

      - name: Test (kafka)
        run: cargo test --features kafka --verbose
