[package]
name = "neurolithe"
version = "0.2.0"
edition = "2024"
description = "A plug-and-play, embedded hybrid Graph-Vector database built in Rust and SQLite that gives AI agents human-like memory."
homepage = "https://neurolithe.com"
documentation = "https://docs.neurolithe.com"
repository = "https://github.com/rezangit/neurolithe"
license = "MIT"
keywords = ["ai", "memory", "graph-database", "vector-search", "mcp"]
categories = ["database", "science"]

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
config = "0.15.19"
dotenvy = "0.15.7"
# Vertex AI service-account auth for embeddings (mints short-lived access
# tokens from GOOGLE_APPLICATION_CREDENTIALS). Same crate + version as Cadmus.
gcp_auth = "0.12"
libsqlite3-sys = "0.36.0"
# Kafka feeder + command consumer + metrics producer — OPTIONAL. Enabled only by
# the `kafka` feature (the JARVIS daemon build). Off by default so the standalone
# MCP server needs no C/librdkafka toolchain and installs/builds cleanly on every
# platform. Builds a vendored librdkafka from source when enabled.
rdkafka = { version = "0.39.0", optional = true }
reqwest = { version = "0.13.2", features = ["json", "rustls"] }
rusqlite = { version = "0.38.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlite-vec = "0.1.6"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
# Mint synthetic dataIds for agent-authored LTM notes (note_<uuidv7>), matching
# JARVIS's prefixed-UUIDv7 identity convention.
uuid = { version = "1.11", features = ["v7"] }

[features]
# Standalone by default: just the embedded stores + the MCP server. No Kafka, no
# rdkafka/librdkafka — `cargo install neurolithe` and run `neurolithe mcp`.
default = []
# The long-running JARVIS daemon: Kafka feeder + memory.command consumer +
# memory.query door + memory.metrics publisher. Pulls in rdkafka.
# Build with: cargo build --release --features kafka
kafka = ["dep:rdkafka"]

[dev-dependencies]
tempfile = "3.25.0"
# test-util enables the paused virtual clock (#[tokio::test(start_paused)])
# used to test the scheduler's interval firing deterministically.
tokio = { version = "1.49.0", features = ["full", "test-util"] }
