# NeuroLithe memory service — the JARVIS "brain", a long-running daemon on the
# always-on Mac mini. Consumes `document.completed`, distills each document, and
# dual-writes it into a decaying STM and a permanent LTM knowledge tree; serves
# recall + introspection over MCP; consumes `memory.command` (soft/hard reset)
# and publishes a CT-scan snapshot to `memory.metrics`.
#
#   docker compose up -d --build     # build + start, online + auto-restart
#   docker compose logs -f           # watch it ingest + publish metrics
#   docker compose down              # stop (both stores persist in the volume)
#
# Requires the Kafka broker (jarvis-kafka) on the shared jarvis-kafka_default
# network — see ../kafka/ — with the topics created via ../kafka/create-topics.sh
# (document.completed, memory.command, memory.metrics, dlq.memory, parking.lot).
# Pithos (the artifact store) must be reachable for document text.
name: jarvis-neurolithe

services:
  neurolithe:
    build: .
    image: neurolithe:latest
    container_name: jarvis-neurolithe
    restart: unless-stopped
    # Optional .env (git-ignored) for secrets/overrides: the Claude chat key
    # (ANTHROPIC_API_KEY), the Pithos read token (NEUROLITHE__PITHOS__TOKEN), and
    # the hard-reset guard token (NEUROLITHE_RESET_TOKEN). Vertex embeddings
    # authenticate via the mounted service-account key (below), not an API key.
    env_file:
      - path: .env
        required: false
    environment:
      # --- bus + archive ---
      # Reach the broker by container name over the shared network (DOCKER
      # listener, advertised as jarvis-kafka:29092).
      NEUROLITHE__KAFKA__BROKERS: jarvis-kafka:29092
      NEUROLITHE__KAFKA__GROUP_ID: neurolithe
      # Pithos on the NAS (LAN) — the feeder fetches pt:// document text here.
      # The read token is a secret: set NEUROLITHE__PITHOS__TOKEN in .env (without
      # it, reads return 401 and every document dead-letters to dlq.memory).
      NEUROLITHE__PITHOS__BASE_URL: http://192.168.4.48:8080

      # --- embeddings / LLM (CONFIGURABLE) ---
      # Chat/reasoning = Claude API (Sonnet 5); embeddings = Google Vertex AI
      # (text-embedding-004, 768-dim), reusing Cadmus's service-account access.
      # The feeder writes ONE embedding to both stores, so STM and LTM dimensions
      # MUST match the embedding model (text-embedding-004 = 768).
      #
      # NOTE (privacy): this sends document text to Anthropic + Google — a CLOUD
      # egress, against JARVIS's offline-first default, chosen consciously. For a
      # fully offline setup, point both halves at a local Ollama instead
      # (provider=custom, base_url=http://host.docker.internal:11434/v1).
      NEUROLITHE__LLM__PROVIDER: anthropic
      NEUROLITHE__LLM__MODEL: claude-sonnet-5
      NEUROLITHE__LLM__EMBEDDING_PROVIDER: vertex
      NEUROLITHE__LLM__EMBEDDING_MODEL: text-embedding-004
      NEUROLITHE__LLM__EMBEDDING_PROJECT: jarvis-cadmus
      NEUROLITHE__LLM__EMBEDDING_LOCATION: us-central1
      # In-container path of the mounted service-account key (see volumes below);
      # overrides any host path inherited from .env.
      GOOGLE_APPLICATION_CREDENTIALS: /etc/neurolithe/key.json
      NEUROLITHE__STM__VECTOR_DIMENSION: 768
      NEUROLITHE__LTM__VECTOR_DIMENSION: 768

      # --- behavior ---
      NEUROLITHE__FEEDER__ENABLED: "true"
      # Both SQLite stores live on the persistent named volume.
      NEUROLITHE__STM__PATH: /data/neurolithe-stm.sqlite
      NEUROLITHE__LTM__PATH: /data/neurolithe-ltm.sqlite
      RUST_LOG: info
    # Lets NEUROLITHE__LLM__BASE_URL reach a model server running on the mini
    # host (Ollama). Harmless if a cloud provider is used instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - neurolithe-data:/data
      # Vertex service-account key (read-only), same key/path Cadmus mounts.
      - /Users/mymini/.config/jarvis/cadmus-vertex-key.json:/etc/neurolithe/key.json:ro

# Join the broker's existing Compose network instead of creating a new one.
networks:
  default:
    name: jarvis-kafka_default
    external: true

volumes:
  neurolithe-data:
