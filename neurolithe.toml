[llm]
# Chat/reasoning runs on the Claude API (Sonnet 5); embeddings run on Google.
# Claude has NO embeddings endpoint, so `embedding_provider` MUST differ.
# Providers: "openai", "gemini", "anthropic", or "custom".
provider = "anthropic"
# Main model for pulling facts out of dialogue (fact extraction / compression).
model = "claude-sonnet-5"
# --- Embeddings (Google Vertex AI; text-embedding-004 = 768-dim) ---
# Reuses Cadmus's Vertex access: service-account auth via
# GOOGLE_APPLICATION_CREDENTIALS (no API key). text-embedding-004 outputs
# 768-dim vectors, so both stores below are set to 768. Chat key comes from
# ANTHROPIC_API_KEY.
embedding_provider = "vertex"
embedding_model = "text-embedding-004"
embedding_project = "jarvis-cadmus"
# text-embedding-004 is served regionally, not on the `global` endpoint that
# Cadmus's OCR uses — us-central1 is a safe region for it.
embedding_location = "us-central1"

# To go fully offline (local LLM), point BOTH halves at Ollama instead, e.g.:
# provider = "custom"
# model = "llama3.1"
# base_url = "http://localhost:11434/v1"
# embedding_provider = "custom"
# embedding_model = "nomic-embed-text"        # 768-dim
# embedding_base_url = "http://localhost:11434/v1"

# Example for Google Gemini:
# provider = "gemini"
# model = "gemini-2.5-flash"
# embedding_model = "text-embedding-004"

# Example for Anthropic Claude (Note: custom embeddings still required):
# provider = "anthropic"
# model = "claude-3-5-haiku-20241022"
# embedding_model = "text-embedding-3-small"

# Example for Custom / Local OpenAI Compatible APIs (like Ollama, LM Studio, vLLM):
# provider = "custom"
# model = "meta-llama/Llama-3-8b-chat-hf"
# embedding_model = "nomic-embed-text"
# base_url = "http://localhost:11434/v1"

# Example for OpenRouter (OpenAI Compatible API):
# provider = "custom"
# model = "openai/gpt-4o-mini" # or any other OpenRouter model string
# embedding_model = "text-embedding-3-small" # Note: OpenRouter doesn't do embeddings natively well yet, you may need a separate provider for embeddings if not using OpenAI/Cohere through them.
# base_url = "https://openrouter.ai/api/v1"

# --- V2 dual memory: two independent SQLite stores ---
# STM = the decaying short-term working-memory engine (today's NeuroLithe).
# LTM = the permanent long-term knowledge tree (never decays).
# Each store locks its own vector_dimension at DB init — changing it on an
# existing file breaks the sqlite-vec table; delete that file to resize.

[stm]
path = "neurolithe-stm.sqlite"
# 768 = Google text-embedding-004 (also local nomic-embed-text). The feeder
# writes one embedding to BOTH stores, so STM and LTM must share this dimension.
# NOTE: changing this from a prior value requires deleting neurolithe-stm.sqlite
# so the sqlite-vec table is rebuilt at the new dimension (the feeder backfills).
vector_dimension = 768

[ltm]
path = "neurolithe-ltm.sqlite"
# Defaults to 768 (local nomic-embed-text) per the offline goal; the embedding
# provider stays configurable and is chosen at deploy time.
vector_dimension = 768

# --- Kafka: feeder + command consumer + metrics publisher (rdkafka) ---
# Topics are created out-of-band by ../kafka/create-topics.sh (no auto-create).
[kafka]
brokers = "localhost:9092"
group_id = "neurolithe"

# --- Pithos archive service: the feeder fetches pt:// document text over HTTP ---
[pithos]
base_url = "http://192.168.4.48:8080"
# Bearer token for read access (a secret). Prefer the env var
# NEUROLITHE__PITHOS__TOKEN / a .env file over committing it here. Empty = no auth.
token = ""

# --- Background schedulers (wired in later slices) ---
[sweep]
# STM decay sweep cadence. The sweep applies one half-life day per pass, so
# daily (86400s) keeps the forgetting curve accurate.
interval_secs = 86400

[metrics]
# How often the CT-scan snapshot is published to memory.metrics.
interval_secs = 60

[feeder]
# Whether the document.completed -> dual-write feeder is active.
enabled = true

[bus_query]
# Whether the memory.query -> memory.result request/reply door is active — the
# bus API that lets Metis read STM + LTM (and write via memory.command). Turn
# off to run ingestion/reset without serving reads. See BUS-MEMORY-EVENTS.md.
enabled = true
